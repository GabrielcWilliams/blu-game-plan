name: Sync deadlines from Canvas

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 8am America/Chicago (CDT, UTC-5)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/sync-deadlines.mjs
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
